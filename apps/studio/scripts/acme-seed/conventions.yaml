# Drift conventions: mined from this codebase, approved by people.
# status: proposed | accepted | rejected    mode: advise | block
# Edit status/mode by hand or with `drift review`. Agents must not edit this file.
version: 1
engine: drift 0.1.0-dev
file_kinds:
  literal_stems:
  - page
  - route
  suffixes:
  - controller
  - service
conventions:
- id: D-987321
  status: accepted
  mode: advise
  summary: >-
    files in packages/ui/** do not import from apps/web/** (declared dependencies,
    and lazy loads of peer or optional dependencies, excepted)
  role:
    package: packages/ui
    dir: "**"
    file: "*"
    entry: '-'
    kind: module
  rule:
    type: avoids
    signal: import:apps/web
  evidence:
    holders: 60
    total: 61
    lower_bound: 0.913
    lift: 3.0
  example: packages/ui/src/alert.tsx#(file)
  selector_version: 3
- id: D-e599ac
  status: rejected
  mode: advise
  summary: "apps/api: functions in src/** are named `run*`, except a shared part (used by several members, not a member)"
  role:
    package: apps/api
    dir: src
    file: "*"
    entry: '-'
    kind: function
  rule:
    type: named
    pattern: run*
  evidence:
    holders: 40
    total: 40
    lower_bound: 0.912
    lift: 5.683
    role_members: 41
