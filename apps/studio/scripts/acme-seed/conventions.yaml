- id: D-b0d245
  status: accepted
  mode: block
  summary: "apps/web: HTTP handlers in app/** (route files) are wrapped in withAdmin() or withWorkspace()"
  role:
    package: apps/web
    dir: app
    file: route
    entry: http
    kind: function
  rule:
    type: wrapped_by
    kind: call
    any_of:
    - apps/web/lib/auth.ts#withAdmin
    - apps/web/lib/auth.ts#withWorkspace
  evidence:
    holders: 87
    total: 93
    lower_bound: 0.866
    lift: 2.505
    split:
    - - apps/web/lib/auth.ts#withWorkspace
      - 68
    - - apps/web/lib/auth.ts#withAdmin
      - 19
  example: apps/web/app/api/admin/abuse/route.ts#GET
