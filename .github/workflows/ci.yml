name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly cross-OS check (on pull requests macOS runs only for Rust changes, non-blocking).
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # Superseded PR runs are cancelled; main keeps every commit's run (macOS included).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo test --all --locked
        env:
          INSTA_UPDATE: "no"

  stack-bound:
    # Worst-case nesting at exactly the size cap, on the parse stack of the release
    # profile that ships (debug builds test an eighth of the cap; see drift_core::stack).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo test --release --locked -p drift-ts -p drift-py --test stack_bound

  rust-changed:
    # Whether a pull request touches the Rust build (crates, manifests, toolchain), so
    # the scarce macOS runner is asked for only when it can find something.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- crates Cargo.toml Cargo.lock rust-toolchain.toml .github/workflows/ci.yml; then
            echo "rust=false" >> "$GITHUB_OUTPUT"
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi

  test-macos:
    # The same snapshot tests on macOS are the cross-OS determinism check. They run on
    # main, nightly and on demand, and on pull requests that change the Rust build
    # (rust-changed), so a macOS-only failure shows before the merge. macOS runners are
    # scarce, so on pull requests the job is non-blocking: its result shows on the pull
    # request but does not fail the run; on main it blocks as before.
    needs: rust-changed
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.rust-changed.outputs.rust == 'true') }}
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo test --all --locked
        env:
          INSTA_UPDATE: "no"

  test-windows:
    # Native Windows (MSVC): the release build and the whole suite, gated as test-macos
    # is (main, nightly, on demand, and pull requests that change the Rust build). Not
    # yet green anywhere, so it never fails the run: its result shows, nothing waits on
    # it. python3 is not on PATH on windows-latest, so the importlib oracle is skipped
    # (it runs on Linux).
    needs: rust-changed
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.rust-changed.outputs.rust == 'true') }}
    continue-on-error: true
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      DRIFT_SKIP_ORACLE: "1"
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo build --release --locked -p drift-cli
      - run: target/release/drift --version
      - run: cargo test --all --locked
        env:
          INSTA_UPDATE: "no"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          command: check advisories bans licenses sources

  study:
    # The study harness tests, one file at a time: the study's half of the shared tier cases
    # (eval/study/tier-cases.json; `test` runs the product's half), the metrics tables, the pipeline on
    # synthetic repos, and select-holdout.mjs verify (full history, so the recorded refs can be replayed;
    # those cases skip when a recorded ref is no longer fetchable).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: for f in eval/study/*.test.mjs; do node --test "$f" || exit 1; done

  oracle:
    # Parameter-type facts (`Symbol.arg_types`) against the TypeScript compiler on the
    # synthetic fixtures of crates/drift-ts/tests/fixtures/param-types*: every key the
    # compiler answers must match, and Drift may answer no key the compiler cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo build --locked -p drift-cli
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/ts" --no-save --no-audit --no-fund --ignore-scripts typescript@5.9.3
      - run: node eval/oracle/fixtures.mjs --drift target/debug/drift
        env:
          TS_PATH: ${{ runner.temp }}/ts/node_modules/typescript

  packaging:
    # The release path without building Drift (no musl build here): YAML and shape
    # of action.yml and the workflows, release.yml's archive step and the npm
    # packages on stub binaries, and the npm launcher (npm/ci-check.mjs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/yaml" --no-save --no-audit --no-fund --ignore-scripts yaml@2.9.1
      - run: node npm/ci-check.mjs "$RUNNER_TEMP/yaml"

  studio:
    # Drift Studio (apps/studio) and its design system (packages/ui).
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck --workspaces
      - run: npx eslint .
      - run: npm test --workspaces
      - run: npm run build -w drift-studio
      - run: npm run build:fixture -w drift-studio
      # The browser for end-to-end tests matches the pinned playwright version.
      - run: npx playwright install --with-deps chromium
      - run: node apps/studio/tests/e2e/run.mjs

  action:
    # The GitHub Action itself (`uses: ./`) on a fixture repository made here: a base
    # commit where `drift init` mined the `withAuth()` wrapper of 38 of 40 routes and a
    # person set it to block, then a change that adds a route without it. The outputs
    # are asserted; the comment and the status go to a fake `gh` (this job must not
    # comment on Drift's own pull requests). The first `uses: ./` installs Drift as
    # every run does (no release for this commit, so a cached build from the Action's
    # own files); the second finds that binary by its commit. The scripts' logic is
    # also tested in the `test` job (crates/drift-cli/tests/gap_action_scripts.rs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Drift with the Action
        id: install
        uses: ./
        with:
          install-only: "true"
      - name: Fixture repository
        env:
          DRIFT_PATH: ${{ steps.install.outputs.drift-path }}
        run: |
          set -euo pipefail
          test "$(command -v drift)" = "$DRIFT_PATH"
          fx="$RUNNER_TEMP/fixture"
          mkdir -p "$fx/lib" && cd "$fx"
          echo '{ "name": "fx" }' > package.json
          echo '{ "compilerOptions": { "baseUrl": ".", "paths": { "@/*": ["./*"] } } }' > tsconfig.json
          printf 'export function withAuth<T>(h: T): T {\n  return h;\n}\n' > lib/auth.ts
          for i in $(seq -w 0 39); do
            mkdir -p "app/api/r$i"
            if [ "$i" -lt 38 ]; then
              printf 'import { withAuth } from "@/lib/auth";\n\nexport const GET = withAuth(async (req: Request) => {\n  return Response.json({ ok: true });\n});\n'
            else
              printf 'export async function GET(req: Request) {\n  return Response.json({ ok: true });\n}\n'
            fi > "app/api/r$i/route.ts"
          done
          mkdir -p src/ui src/other
          for i in $(seq 10 29); do
            printf 'export function Card%s() {\n  return <div>c</div>;\n}\n' "$i" > "src/ui/c$i.tsx"
            printf 'export function other%s() {\n  return %s;\n}\n' "$i" "$i" > "src/other/o$i.ts"
          done
          echo '.drift/cache/' > .gitignore
          drift init
          id=$(drift census --json | jq -r '.proposals[] | select(.rule_kind == "wrapped_by:call") | .id')
          test -n "$id"
          drift review --block "$id"
          g() { git -c user.name=ci -c user.email=ci@example.invalid -c commit.gpgsign=false "$@"; }
          g init -q -b base && g add -A && g commit -qm base
          # What a pull request checkout has: its base branch as origin/<base>.
          g update-ref "refs/remotes/origin/${GITHUB_BASE_REF:-main}" HEAD
          g checkout -qb change
          mkdir -p app/api/new
          printf 'export async function POST(req: Request) {\n  return Response.json({ ok: true });\n}\n' > app/api/new/route.ts
          g add -A && g commit -qm change
      - name: Fake gh
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          cat > "$RUNNER_TEMP/fake/gh" <<'SH'
          #!/usr/bin/env bash
          echo "gh $*" >> "$RUNNER_TEMP/gh.log"
          exit 0
          SH
          chmod +x "$RUNNER_TEMP/fake/gh"
          echo "$RUNNER_TEMP/fake" >> "$GITHUB_PATH"
      - name: Run the Action on the fixture
        id: drift
        uses: ./
        # A block violation fails the step; the next step asserts that it did.
        continue-on-error: true
        with:
          working-directory: ${{ runner.temp }}/fixture
          upload-sarif: file
          comment: "true"
          status: commit
      - name: The Action's outputs
        env:
          OUTCOME: ${{ steps.drift.outcome }}
          EXIT_CODE: ${{ steps.drift.outputs.exit-code }}
          BLOCK: ${{ steps.drift.outputs.block }}
          ADVISE: ${{ steps.drift.outputs.advise }}
          SECURITY: ${{ steps.drift.outputs.security-findings }}
          SECURITY_ADVICE: ${{ steps.drift.outputs.security-advice }}
          UNCHECKED: ${{ steps.drift.outputs.unchecked }}
          SARIF: ${{ steps.drift.outputs.sarif }}
          REPORT: ${{ steps.drift.outputs.report }}
          HOW: ${{ steps.drift.outputs.installed-from }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euxo pipefail
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 1
          test "$BLOCK" = 1
          test "$ADVISE" = 0
          test "$SECURITY" = 0
          test "$UNCHECKED" = 0
          test "$HOW" = cached
          jq -e '.runs[0].results | length == 1' "$SARIF"
          jq -e '[.violations[] | select(.baselined | not)] | map(.path) == ["app/api/new/route.ts"]' "$REPORT"
          grep -q "gh api --method POST repos/$GITHUB_REPOSITORY/statuses/" "$RUNNER_TEMP/gh.log"
          if [ "$EVENT" = pull_request ]; then
            jq -e '.diff.base' "$REPORT"
            test "$SECURITY_ADVICE" = 1
            grep -q "gh api --method POST repos/$GITHUB_REPOSITORY/issues/.*/comments" "$RUNNER_TEMP/gh.log"
          fi
