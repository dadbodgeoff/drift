# `verify:ci` covers build, typecheck, unit/e2e tests, engine fmt/clippy, boundary and
# release-matrix validation, product claims, and the beta proof — everything a hosted runner can
# execute. It does not run the external-repo evals (`verify:evals`): those need the seven pinned
# evaluation repos cloned to $DRIFT_EVAL_REPOS plus a release engine binary, neither of which exist
# on a hosted runner. Evals are a local gate — run `pnpm verify:full` before citing a "verified"
# claim in docs/, and record the machine and commit it ran on.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # fetch-depth: 0 is required: `pnpm beta:proof` runs `drift start` against a fixture, and
      # Drift refuses to derive repo identity from a shallow clone (its root commit is the fetch
      # graft, not the repo's real first commit).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Pinned, and stated here because dtolnay/rust-toolchain needs it as an input. It MUST match
      # rust-toolchain.toml, which is what developer machines read - two copies of a version is the
      # same drift hazard as two copies of a predicate, so release-hygiene.test.ts fails if they
      # disagree. `@stable` used to float here, and a new clippy lint reddened this gate with no
      # change to the repository at all.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Several CLI tests point DRIFT_ENGINE_BIN at target/release/drift-engine; `pnpm test:engine`
      # (cargo test) only produces a debug binary, so the release build must happen explicitly here
      # first — otherwise a missing binary surfaces as a test failure instead of a build failure.
      - name: Build the release engine
        run: pnpm build:engine

      - name: Verify
        run: pnpm verify:ci
