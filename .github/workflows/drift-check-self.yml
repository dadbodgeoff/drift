# The dogfooding gate: runs Drift against Drift's own diff, and is red when Drift is wrong.
# `docs/ci-integration.md` describes what a *consumer* should copy — this is not that, since it
# builds the engine from source out of this workspace rather than installing a published platform
# package. That's slower, and deliberate: there's no Linux engine binary published yet (see
# docs/architecture/engine-release.md), so an npm install would resolve @drift/engine-linux-x64-gnu
# to an empty package and the CLI would refuse.

name: Drift check (self)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      # Full history: the check compares against the merge base, and a shallow clone has no base to
      # compare to. Repo identity also reads the root commit, which a depth-1 clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the engine from source
        run: cargo build --release -p drift-engine

      - name: Install Drift
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Adopt the committed contract
        env:
          DRIFT_ENGINE_BIN: ${{ github.workspace }}/target/release/drift-engine
        run: |
          # Identity is derived from the git remote and root commit, so the contract committed by a
          # developer imports here even though CI checks out to a path nobody shares.
          node packages/cli/dist/main.js start --repo-root . --accept-defaults --json
          REPO_ID=$(ls "$HOME/.drift/repos" | head -1)
          echo "DRIFT_REPO_ID=$REPO_ID" >> "$GITHUB_ENV"
          echo "DRIFT_DB=$HOME/.drift/repos/$REPO_ID/drift.sqlite" >> "$GITHUB_ENV"
          # drift.lock is a precondition, not an option. Inference finds nothing to propose on this
          # repo - it is a TS/Rust monorepo with no routes and no data layer, so `start` yields zero
          # candidates - and without a committed contract `check` correctly refuses with
          # empty_contract. That refusal was read as a Drift failure and went red on every PR from
          # #108 onward while the actual cause was a missing file. Fail here, where the message can
          # say so, rather than letting it surface as an unexplained refusal one step later.
          if [ ! -f drift.lock ]; then
            echo "::error::drift.lock is missing. This gate enforces the committed contract; without it Drift has nothing to check and will refuse. Export one with 'drift contract export --output drift.lock --confirm'."
            exit 1
          fi
          node packages/cli/dist/main.js contract import drift.lock \
            --repo "$REPO_ID" --confirm --json

      - name: Check the diff
        env:
          DRIFT_ENGINE_BIN: ${{ github.workspace }}/target/release/drift-engine
        run: |
          set +e
          node packages/cli/dist/main.js check \
            --db "$DRIFT_DB" \
            --repo "$DRIFT_REPO_ID" \
            --diff "origin/${{ github.base_ref }}...HEAD" \
            --scope changed-hunks \
            --json > drift-check.json
          EXIT=$?
          set -e
          cat drift-check.json

          # Exit codes are a contract (docs/reference/enforcement.md): 0 clean, 2 the diff violates
          # the contract, 3 Drift refused to answer, 1 Drift itself failed.
          #
          # 3 is treated as a failure deliberately. It means no enforcement claim was made — a stale
          # scan, a missing contract, an unavailable engine — and a guardrail that reports success
          # when it could not check is worse than one that stops.
          # A refusal and a violation are both red, but they are not the same event and must not
          # read the same. Exit 2 means the diff broke a rule someone committed. Exit 3 means Drift
          # made no claim at all - and when the reason is configuration rather than code, saying so
          # is the difference between a gate people fix and a gate people learn to ignore.
          REFUSAL=$(python3 -c "import json,sys; d=json.load(open('drift-check.json')); print((d.get('failure') or {}).get('code',''))" 2>/dev/null || echo "")

          case "$EXIT" in
            0) echo "Drift: no blocking violations" ;;
            2) echo "::error::Drift found a new violation in this diff"; exit 1 ;;
            3)
              # W8-2: this branch used to print "unknown" for every refusal `check` RETURNS rather
              # than throws, because those payloads carried `summary.blocked_reasons` and no
              # `failure` object - so the one field this step reads was absent on exactly the
              # refusals a working gate produces. Each code below now arrives from run-check.ts.
              case "$REFUSAL" in
                empty_contract|missing_contract)
                  echo "::error::Drift refused because the contract is empty - a configuration problem in this workflow, not a problem with this diff. Check that drift.lock imported."
                  ;;
                full_scope_cannot_block)
                  echo "::error::Drift refused because this step used --scope full, which cannot block: it attributes every finding to existing code, so exit 2 is unreachable and a pass would mean nothing. Use --scope changed-hunks with a --diff range. A configuration problem in this workflow, not a problem with this diff."
                  ;;
                enforcement_degraded_by_incomplete_coverage)
                  echo "::error::Drift refused because coverage gaps zeroed the enforcement on a finding it did produce, so it will not report a pass it cannot stand behind. summary.blocked_reasons names the files - usually an import Drift could not resolve."
                  ;;
                contract_stale_under_strict)
                  echo "::error::Drift refused because --strict-contract was passed and this contract's forbidden specifiers no longer match anything in the repo, so the gate enforces nothing. Update or retire the conventions in summary.contract_staleness."
                  ;;
                typescript_fallback_used|missing_engine)
                  echo "::error::Drift refused because the Rust engine was unavailable and no enforcement claim can be made without it. Check that the engine built and that DRIFT_ENGINE_BIN points at it."
                  ;;
                engine_timeout)
                  echo "::error::Drift refused because the engine exceeded its time cap and was killed, so no scan completed. Raise DRIFT_ENGINE_TIMEOUT_MS if this repository legitimately needs longer."
                  ;;
                *)
                  echo "::error::Drift declined to check this diff (refusal, not a pass): ${REFUSAL:-unknown}"
                  ;;
              esac
              exit 1
              ;;
            *) echo "::error::Drift failed to run"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-check
          path: drift-check.json
