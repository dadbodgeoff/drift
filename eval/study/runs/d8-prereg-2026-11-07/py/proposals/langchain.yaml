- id: D-0e154c
  status: proposed
  mode: advise
  summary: "libs/langchain_v1: TypedDicts in langchain/agents/** take `TypedDict` from typing_extensions, not typing"
  role:
    package: libs/langchain_v1
    dir: langchain/agents
    file: "*"
    entry: '-'
    kind: class
    variety: typeddict
  rule:
    type: imports_from
    name: TypedDict
    source: pkg:typing_extensions#TypedDict
    instead_of:
    - pkg:python:typing#TypedDict
  evidence:
    holders: 18
    total: 19
    lower_bound: 0.754
    lift: 1.0
    split:
    - - typing_extensions
      - 18
    - - typing
      - 1
    python_members: 19
  example: libs/langchain_v1/langchain/agents/middleware/_redaction.py#PIIMatch
