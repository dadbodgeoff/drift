- id: D-df24f2
  status: proposed
  mode: advise
  summary: >-
    files in apps/studio/** use lucide-react for icons, not
    react-icons/@heroicons/react/@tabler/icons-react/@radix-ui/react-icons/@phosphor-icons/react
  role:
    package: apps/studio
    dir: "**"
    file: "*"
    entry: '-'
    kind: module
  rule:
    type: prefers_library
    group: icons
    preferred: lucide-react
  evidence:
    holders: 870
    total: 872
    lower_bound: 0.992
    lift: 1.0
    split:
    - - lucide-react
      - 872
    - - "@heroicons/react"
      - 2
  example: apps/studio/components/grid/components/editor/DateTimeEditor.tsx#(file)
