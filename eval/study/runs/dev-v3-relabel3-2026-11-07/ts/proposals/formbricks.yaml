conventions:
- id: D-b8f1ee
  status: proposed
  mode: advise
  summary: >-
    files in packages/surveys/** do not import from apps/web/** (declared
    dependencies, and lazy loads of peer or optional dependencies, excepted)
  role:
    package: packages/surveys
    dir: "**"
    file: "*"
    entry: '-'
    kind: module
  rule:
    type: avoids
    signal: import:apps/web
  evidence:
    holders: 115
    total: 116
    lower_bound: 0.953
    lift: 3.0
  example: packages/surveys/eslint.config.mjs#(file)
  selector_version: 2
- id: D-73b648
  status: proposed
  mode: advise
  summary: "apps/web: server actions in modules/ee/** (actions files) are wrapped in authenticatedActionClient.inputSchema().action()"
  role:
    package: apps/web
    dir: modules/ee
    file: actions
    entry: server_action
    kind: function
  rule:
    type: wrapped_by
    kind: call
    any_of:
    - >-
      apps/web/lib/utils/action-client/index.ts#authenticatedActionClient.inputSchema().action
